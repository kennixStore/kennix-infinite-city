<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d13" />
    <meta name="description" content="KENNIX: INFINITE CITY — an original open-world racing game with realistic driving and city exploration." />
    <title>KENNIX: INFINITE CITY</title>
  </head>
  <body>
    <div id="game-shell">
      <header class="game-header">
        <div class="brand">KENNIX <span>INFINITE CITY</span></div>
        <div class="status">NOVA CITY • EARLY ACCESS BUILD</div>
      </header>
      <main id="game-stage">
        <canvas id="application" aria-label="KENNIX Infinite City 3D driving game"></canvas>
        <section id="intro-overlay" class="intro-overlay" aria-label="KENNIX Infinite City introduction">
          <video id="intro-video" class="intro-video" playsinline preload="auto"></video>
          <div class="intro-shade"></div>
          <div class="intro-title"><span>WELCOME TO</span><strong>KENNIX</strong><b>INFINITE CITY</b><small>ONE CITY. ENDLESS POSSIBILITIES.</small></div>
          <div class="intro-actions"><button id="intro-sound" type="button">ENABLE SOUND</button><button id="intro-skip" type="button">SKIP INTRO</button></div>
          <div class="intro-progress"><i></i></div>
        </section>
        <div class="scene-label">
          <strong>NOVA CITY • FIRST DISTRICT</strong>
          <span>Explore • race • customise</span>
        </div>
        <div class="hud-speed"><span id="speed-value">000</span><small>KM/H</small><b class="gear-indicator">GEAR <span id="gear-value">N</span></b></div>
      </main>
      <footer>KENNIX GAME STUDIOS <span>ONE CITY. ENDLESS POSSIBILITIES.</span></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
