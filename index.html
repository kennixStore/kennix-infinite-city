<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10151d" />
    <meta name="description" content="KENNIX: INFINITE CITY — an original browser-based 3D driving prototype." />
    <title>KENNIX: INFINITE CITY</title>
  </head>
  <body>
    <div id="game-shell">
      <header class="game-header">
        <div class="brand">KENNIX <span>INFINITE CITY</span></div>
        <div class="status">EARLY DEVELOPMENT BUILD</div>
      </header>
      <main id="game-stage">
        <canvas id="application" aria-label="KENNIX Infinite City 3D driving prototype"></canvas>
        <div class="scene-label">
          <strong>DRIVING PROTOTYPE 0.1</strong>
          <span>Test road • placeholder city • early controls</span>
        </div>
        <div class="hud-speed"><span id="speed-value">000</span><small>KM/H</small></div>
      </main>
      <footer>PROJECT BUILD 0.1.0 <span>ONE CITY. ENDLESS POSSIBILITIES.</span></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
