name: Import realistic CC0 vehicle models

on:
  push:
    paths:
      - ".github/workflows/import-kenney-vehicles.yml"

permissions:
  contents: write

jobs:
  import-vehicles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download original realistic CC0 vehicles
        run: |
          set -euo pipefail
          mkdir -p public/models/vehicles
          curl -fL --retry 3 "https://cdn.3dassets.dev/assets/32488/v1/model.glb" -o public/models/vehicles/sport-coupe.glb
          curl -fL --retry 3 "https://cdn.3dassets.dev/assets/32490/v1/model.glb" -o public/models/vehicles/sedan.glb
          curl -fL --retry 3 "https://cdn.3dassets.dev/assets/32500/v1/model.glb" -o public/models/vehicles/suv.glb
          curl -fL --retry 3 "https://cdn.3dassets.dev/assets/32495/v1/model.glb" -o public/models/vehicles/mid-engine-sports.glb
          for file in public/models/vehicles/*.glb; do
            test -s "$file"
            printf '%s: ' "$file"
            wc -c < "$file"
          done

      - name: Commit realistic vehicles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/vehicles/*.glb
          git commit -m "Add realistic CC0 road vehicles [skip ci]"
          git push
