name: Inspect KENNIX racing intro source
on:
  push:
    paths:
      - ".github/workflows/intro-inspection.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download source clip
        run: |
          curl -L --fail --retry 3 "https://videos.pexels.com/video-files/35661513/15112178_1920_1080_120fps.mp4" -o drift.mp4
          test "$(stat -c%s drift.mp4)" -gt 1000000
      - name: Inspect clip and make contact sheet
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate -of json drift.mp4 > metadata.json
          mkdir -p frames
          for t in 1 3 5 7 9 11 13; do ffmpeg -ss "$t" -i drift.mp4 -frames:v 1 -vf "scale=640:-1" "frames/frame-$t.jpg" -y; done
          ffmpeg -y -pattern_type glob -i 'frames/frame-*.jpg' -filter_complex "tile=2x4:padding=12:margin=12" -frames:v 1 contact-sheet.jpg
          cat metadata.json
      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: kennix-intro-source-inspection
          path: |
            drift.mp4
            metadata.json
            contact-sheet.jpg
            frames/
          retention-days: 3
